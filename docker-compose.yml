services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engineering-ai-api
    # host.docker.internal only resolves automatically on Docker Desktop; on Linux it
    # must be mapped to the host gateway or OLLAMA_BASE_URL below can't be reached.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://raguser:ragpassword@postgres:5432/ragdb
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:3b
      # Ollama defaults num_ctx to 2048 regardless of the model's real context length
      # (Qwen2.5:3b natively supports 32768) — see app/core/llm_gateway.py.
      - OLLAMA_NUM_CTX=8192
      - EMBEDDING_MODEL_NAME=BAAI/bge-base-en-v1.5
      - RERANKER_MODEL_NAME=cross-encoder/ms-marco-MiniLM-L-6-v2
      - NLI_MODEL_NAME=cross-encoder/nli-deberta-v3-small
      # Calibrated to bge-base-en-v1.5's 512-token sequence limit — matches .env.example.
      - CHUNK_SIZE=200
      - CHUNK_OVERLAP=30
      - MAX_CHUNK_SIZE=240
      - MAX_AGENT_STEPS=6
      - MAX_LLM_CALLS=6
      - MAX_TOOL_CALLS=5
      - API_KEY=dev-api-key
      - MCP_API_KEY=mcp-secret-token
      - LOG_LEVEL=INFO
      - MCP_SERVER_URL=http://mcp-server:8765/mcp
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engineering-mcp-server
    command: python -m mcp_server.server
    ports:
      - "8765:8765"
    environment:
      - DATABASE_URL=postgresql+psycopg2://raguser:ragpassword@postgres:5432/ragdb
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
      - MCP_API_KEY=mcp-secret-token
    healthcheck:
      # Hits the unauthenticated /health route specifically (see mcp_server/server.py).
      # The previous healthcheck hit /mcp, which AuthMiddleware always 401s without a
      # bearer token, so this container could never report healthy and `api` (which
      # depends_on it with condition: service_healthy) never started.
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8765/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: engineering-ai-frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side only (read by the Express proxy in server/index.js, never sent to
      # the browser) — must be the Docker Compose service name, not localhost, since
      # this container reaches `api` over the compose network.
      - NODE_ENV=production
      - API_BACKEND_URL=http://api:8000
      - API_KEY=dev-api-key
    depends_on:
      - api

volumes:
  postgres_data:
