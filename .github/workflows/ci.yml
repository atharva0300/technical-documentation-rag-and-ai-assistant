name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (Unit, Agent, API & Security)
        env:
          PYTHONPATH: .
        run: |
          # Integration tests marked @pytest.mark.integration require a live FastMCP server + PostgreSQL pgvector DB container.
          # Fast unit tests are run on every push; process-to-process integration tests are executed in local dev / staging workflows.
          pytest -v -m "not integration"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend (Vite)
        working-directory: ./frontend
        run: npm run build
